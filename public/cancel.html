<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/img/logo.ico">
    <meta name="theme-color" content="#c0394d">
    <title>Annulla la prenotazione · Open Day</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/script/cancel.js" defer></script>
  </head>
  <body class="admin-page"><span class="decor decor-3" aria-hidden="true"></span><span class="decor decor-4" aria-hidden="true"></span>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Open Day, pagina iniziale">
        <img class="brand-logo" src="/img/logo.png" alt="Istituto d'Istruzione Superiore Europa Unita, Lissone" width="930" height="220" />
        <span class="brand-tag">OPEN <strong>DAY</strong></span>
      </a>
      <a class="header-link" href="/">← Torna alle prenotazioni</a>
    </header>

    <main class="admin-main">
  
      <section class="admin-panel">
         <h1>Non puoi più venire? Annulla la <span>visita.</span></h1>
        <p>Libererai i posti per altri studenti. Ti servono il codice di prenotazione e l'email usata.</p>

        <form id="cancel-form" class="admin-login-form">
          <label for="cancel-code">Codice di prenotazione</label>
          <input id="cancel-code" name="code" maxlength="10" autocomplete="off" placeholder="Es. 1A2B3C4D5E" required>
          <label for="cancel-email">Email usata per prenotare</label>
          <input id="cancel-email" name="email" type="email" autocomplete="email" maxlength="120" required>
          <div id="cancel-message" class="form-message" role="status" aria-live="polite" hidden></div>
          <button class="submit-button" type="submit"><span>Annulla la prenotazione</span><span aria-hidden="true">↗</span></button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <span>OPEN DAY · <strong>Annullamento</strong></span>
      <a href="/">Prenota una nuova visita ↗</a>
    </footer>
  </body>
</html>
