<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c0394d">
    <title>Il tuo biglietto · Open Day</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/ticket.js" defer></script>
  </head>
  <body class="admin-page"><span class="decor decor-3" aria-hidden="true"></span><span class="decor decor-4" aria-hidden="true"></span>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Open Day, pagina iniziale">
        <img class="brand-logo" src="/logo.png" alt="Istituto d'Istruzione Superiore Europa Unita, Lissone" width="930" height="220" />
        <span class="brand-tag">OPEN <strong>DAY</strong></span>
      </a>
      <a class="header-link" href="/cancel">Annulla prenotazione</a>
    </header>

    <main class="admin-main">
      <div id="ticket-error" class="form-message" role="alert" hidden></div>
      <article id="ticket" class="ticket" hidden>
        <p class="eyebrow">Biglietto d'ingresso</p>
        <h1 id="ticket-name"></h1>
        <p id="ticket-school" class="ticket-school no-print"></p>
        <img id="ticket-qr" class="ticket-qr" width="240" height="240" alt="QR code del biglietto">
        <p class="ticket-code" id="ticket-code"></p>
        <dl class="ticket-details">
          <div class="no-print"><dt>Turno</dt><dd id="ticket-turn"></dd></div>
          <div><dt>Persone</dt><dd id="ticket-attendees"></dd></div>
          <div class="no-print"><dt>Indirizzo</dt><dd id="ticket-program"></dd></div>
        </dl>
        <p class="ticket-help no-print">Mostra questo QR code all'ingresso. Puoi stamparlo o salvarlo sul telefono.</p>
        <button class="submit-button" id="print-ticket" type="button"><span>Stampa la prenotazione</span><span aria-hidden="true">↗</span></button>
      </article>
    </main>

    <footer class="site-footer">
      <span>OPEN DAY · <strong>Biglietto</strong></span>
      <a href="/">Torna al sito ↗</a>
    </footer>
  </body>
</html>
