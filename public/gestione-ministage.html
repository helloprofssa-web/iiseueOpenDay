<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c0394d">
    <title>Gestione mini stage · Open Day</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/xlsx.js" defer></script>
    <script src="/gestione-ministage.js" defer></script>
  </head>
  <body class="admin-page"><span class="decor decor-3" aria-hidden="true"></span><span class="decor decor-4" aria-hidden="true"></span>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Open Day, pagina iniziale">
        <img class="brand-logo" src="/img/logo.png" alt="Istituto d'Istruzione Superiore Europa Unita, Lissone" width="930" height="220" />
        <span class="brand-tag">OPEN <strong>DAY</strong></span>
      </a>
      <a class="header-link" href="/admin">← Area organizzatori</a>
    </header>

    <main class="admin-main">
      <section class="admin-intro">
        <p class="eyebrow">Area organizzatori</p>
        <h1>Gestione <span>mini stage.</span></h1>
        <p>Crea i mini stage per liceo e tecnico e consulta le iscrizioni.</p>
      </section>

      <section id="admin-login-panel" class="admin-panel">
        <h2>Accesso riservato</h2>
        <p>Inserisci la chiave amministratore.</p>
        <form id="admin-login-form" class="admin-login-form">
          <label for="admin-key">Chiave amministratore</label>
          <input id="admin-key" name="key" type="password" autocomplete="current-password" required>
          <div id="admin-login-message" class="form-message" role="alert" hidden></div>
          <button class="submit-button" type="submit"><span>Accedi</span><span aria-hidden="true">↗</span></button>
        </form>
      </section>

      <section id="admin-dashboard" hidden>
        <div class="admin-toolbar">
          <div><h2 id="ministage-form-title">Nuovo mini stage</h2></div>
          <button id="admin-logout" class="text-button" type="button">Esci</button>
        </div>
        <form id="ministage-admin-form" class="booking-form">
          <div class="form-grid ministage-admin-grid">
            <label>Open Day
              <select name="schoolType" required>
                <option value="liceo">Liceo</option>
                <option value="tecnico">Tecnico</option>
              </select>
            </label>
            <label>Titolo
              <input name="title" maxlength="120" placeholder="Es. Laboratorio di informatica" required>
            </label>
            <label>Primo giorno e ora di inizio
              <input name="startsAt" type="datetime-local" required>
            </label>
            <label>Ora di fine
              <input name="endTime" type="time">
            </label>
            <label>Ultimo giorno (facoltativo)
              <input name="lastDay" type="date">
              <small>Se indicato, crea un mini stage per ogni giorno feriale, dal primo all'ultimo giorno.</small>
            </label>
            <label>Posti disponibili
              <input name="capacity" type="number" min="1" max="1000" value="20" required>
            </label>
            <label class="full-width">Luogo (facoltativo)
              <input name="location" maxlength="120" placeholder="Es. Aula 12">
            </label>
            <label class="full-width">Descrizione (facoltativa)
              <input name="description" maxlength="1000" placeholder="Breve descrizione dell'attività">
            </label>
          </div>
          <div id="ministage-admin-message" class="form-message" role="status" aria-live="polite" hidden></div>
          <button class="submit-button" type="submit"><span id="ministage-submit-label">Aggiungi mini stage</span><span aria-hidden="true">↗</span></button>
          <button id="ministage-cancel-edit" class="text-button" type="button" hidden>Annulla modifica</button>
        </form>

        <div class="admin-toolbar reservations-toolbar">
          <div><h2>Elenco mini stage</h2></div>
          <button id="export-ministage-liceo" class="header-link export-button" type="button">Esporta Liceo (Excel)</button>
          <button id="export-ministage-tecnico" class="header-link export-button" type="button">Esporta Tecnico (Excel)</button>
          <button id="export-emails-liceo" class="header-link export-button" type="button">Email Liceo (questionario)</button>
          <button id="export-emails-tecnico" class="header-link export-button" type="button">Email Tecnico (questionario)</button>
        </div>
        <div id="ministage-admin-list" class="reservations-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>OPEN DAY · <strong>Area organizzatori</strong></span>
      <a href="/">Vai al sito ↗</a>
    </footer>
  </body>
</html>
