<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/img/logo.ico">
    <meta name="theme-color" content="#c0394d">
    <title>Gestione mini stage· Open Day</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/script/xlsx.js" defer></script>
    <script src="/script/gestione-ministage.js" defer></script>
  </head>
  <body class="admin-page"><span class="decor decor-3" aria-hidden="true"></span><span class="decor decor-4" aria-hidden="true"></span>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Open Day, pagina iniziale">
        <img class="brand-logo" src="/img/logo.png" alt="Istituto d'Istruzione Superiore Europa Unita, Lissone" width="930" height="220" />
        <span class="brand-tag">OPEN <strong>DAY</strong></span>
      </a>
      <a class="header-link" href="/admin">← Area organizzatori</a>
    </header>

    <main class="admin-main">
      <section class="admin-intro">
        <p class="eyebrow">Area organizzatori</p>
        <h1>Gestione <span>mini stage.</span></h1>
        <p>Consulta le iscrizioni ai mini stage di liceo e tecnico.</p>
      </section>

      <section id="admin-login-panel" class="admin-panel">
        <h2>Accesso riservato</h2>
        <p>Inserisci la chiave amministratore.</p>
        <form id="admin-login-form" class="admin-login-form">
          <label for="admin-key">Chiave amministratore</label>
          <input id="admin-key" name="key" type="password" autocomplete="current-password" required>
          <div id="admin-login-message" class="form-message" role="alert" hidden></div>
          <button class="submit-button" type="submit"><span>Accedi</span><span aria-hidden="true">↗</span></button>
        </form>
      </section>

      <section id="admin-dashboard" hidden>
        <div class="admin-toolbar">
          <div><h2>Giornate e iscritti</h2><p class="admin-subtitle">Posti occupati per ogni giornata.</p></div>
          <button id="admin-logout" class="text-button" type="button">Esci</button>
        </div>
        <div id="ministage-admin-message" class="form-message" role="status" aria-live="polite" hidden></div>
        <div class="admin-toolbar reservations-toolbar">
          <div><h2>Esporta</h2></div>
          <button id="export-ministage-liceo" class="header-link export-button" type="button">Esporta Liceo (Excel)</button>
          <button id="export-ministage-tecnico" class="header-link export-button" type="button">Esporta Tecnico (Excel)</button>
        </div>
        <div id="ministage-admin-list" class="reservations-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>OPEN DAY· <strong>Area organizzatori</strong></span>
      <a href="/">Vai al sito ↗</a>
    </footer>
  </body>
</html>
